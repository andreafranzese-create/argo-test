apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-test-podinfo-prod

resources:
  - ../base

helmCharts:
  - name: podinfo
    repo: https://stefanprodan.github.io/podinfo
    version: 6.9.0
    releaseName: podinfo
    namespace: argo-test-podinfo-prod
    skipTests: true
    valuesFile: ../base/values.yaml
    valuesInline:
      replicaCount: 2
      ui:
        message: "Ambiente PROD"
        color: "#c62828"               # rosso